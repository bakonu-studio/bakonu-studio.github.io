<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바코누 - 바이브코딩 알려주는 누나</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: linear-gradient(180deg, #fff7f0 0%, #ffffff 340px);
    color: #241b16;
  }
  header {
    padding: 56px 24px 40px;
    text-align: center;
    background: linear-gradient(160deg, #ffe4d6 0%, #ffd7c2 100%);
    border-radius: 0 0 36px 36px;
  }
  .avatar {
    width: 148px; height: 148px;
    border-radius: 50%;
    background: #fff2e8;
    border: 5px solid #ffffff;
    box-shadow: 0 10px 26px rgba(217,119,87,0.28);
    overflow: hidden;
    position: relative;
    margin: 0 auto;
  }
  .avatar img {
    position: absolute;
    width: 380px; height: auto;
    left: 50%; top: -118px;
    transform: translateX(-50%);
  }
  h1 {
    margin: 18px 0 4px;
    font-size: 34px;
    font-weight: 800;
    color: #b8482a;
    letter-spacing: -0.5px;
  }
  .tagline {
    margin: 0 0 18px;
    font-size: 16px;
    color: #7a5240;
    opacity: 0.9;
  }
  .cta {
    display: inline-block;
    padding: 12px 28px;
    background: #d97757;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 8px 18px rgba(217,119,87,0.35);
  }
  main { padding: 30px 18px 60px; max-width: 720px; margin: 0 auto; }
  .section-title {
    font-size: 20px;
    font-weight: 800;
    color: #241b16;
    margin: 8px 4px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4caf50;
    box-shadow: 0 0 0 0 rgba(76,175,80,.6);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(76,175,80,.5); }
    70% { box-shadow: 0 0 0 8px rgba(76,175,80,0); }
    100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
  }
  .live-label { font-size: 12px; font-weight: 700; color: #4caf50; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(60,40,30,0.10);
    transition: transform .15s ease;
  }
  .card:hover { transform: translateY(-3px); }
  .thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #eee;
    overflow: hidden;
  }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-body { padding: 14px 16px 18px; }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.4;
    margin: 0;
    color: #241b16;
  }
  .loading { color: #9a8a7f; font-size: 14px; padding: 20px 4px; }
  .idea-box {
    background: #fff;
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 4px 16px rgba(60,40,30,0.10);
    margin-bottom: 44px;
  }
  .idea-box h3 { margin: 0 0 6px; font-size: 18px; }
  .idea-box p.hint { margin: 0 0 16px; font-size: 13px; color: #9a8a7f; }
  .idea-box textarea {
    width: 100%;
    min-height: 90px;
    border-radius: 14px;
    border: 1px solid #eadfd6;
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    box-sizing: border-box;
  }
  .idea-box textarea:focus { outline: 2px solid #d97757; }
  .honeypot { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .idea-submit {
    margin-top: 12px;
    padding: 11px 24px;
    background: #d97757;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }
  .idea-submit:disabled { opacity: 0.5; cursor: default; }
  .idea-status { margin-top: 10px; font-size: 13px; color: #7a5240; min-height: 18px; }
  footer {
    text-align: center;
    padding: 30px 20px 50px;
    color: #9a8a7f;
    font-size: 13px;
  }
  footer a { color: #d97757; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="avatar"><img src="assets/avatar.png" alt="바코누"></div>
  <h1>바코누</h1>
  <p class="tagline">바이브코딩 알려주는 누나 · Claude Code로 게임을 하나씩 완성해갑니다</p>
  <a class="cta" href="https://www.youtube.com/@바코누" target="_blank" rel="noopener">유튜브에서 구독하기</a>
</header>
<main>
  <div class="idea-box">
    <h3>💡 바코누에게 아이디어 던져주기</h3>
    <p class="hint">만들어봤으면 하는 사이트나 앱, 게임 기능 아이디어를 적어주세요. 적어주시면 무조건 만들어드립니다!</p>
    <form id="ideaForm">
      <textarea id="ideaText" maxlength="500" placeholder="예: 방문자 수 카운터가 있는 사이트를 만들어줘"></textarea>
      <input type="text" name="website" class="honeypot" tabindex="-1" autocomplete="off">
      <div>
        <button type="submit" class="idea-submit" id="ideaSubmitBtn">아이디어 보내기</button>
      </div>
      <div class="idea-status" id="ideaStatus"></div>
    </form>
  </div>

  <a class="idea-box" href="./shooter/" style="display:block; text-decoration:none; color:inherit; text-align:center;">
    <h3>🚀 클로드가 만든 슈팅 게임</h3>
    <p class="hint">기획부터 배포까지 클로드가 통째로 만든 미니게임입니다. 눌러서 바로 플레이해보세요!</p>
    <span class="idea-submit" style="display:inline-block;">게임 플레이하기</span>
  </a>

  <div class="section-title"><span class="live-dot"></span>영상 목록 <span class="live-label">실시간 연동</span></div>
  <div class="grid" id="grid"><div class="loading">불러오는 중...</div></div>
</main>
<footer>
  © 바코누 · <a href="https://www.youtube.com/@바코누" target="_blank" rel="noopener">youtube.com/@바코누</a>
</footer>
<script>
const API_KEY = "AIzaSyClLwHEApAYXxNpRCTJrYB_I0qFUsUKUa8";
const UPLOADS_PLAYLIST_ID = "UUR0BBnhQvt1nUgbnDlTQgtA";

async function loadVideos() {
  const grid = document.getElementById("grid");
  try {
    const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=25&playlistId=${UPLOADS_PLAYLIST_ID}&key=${API_KEY}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("API " + res.status);
    const data = await res.json();
    grid.innerHTML = "";
    for (const item of data.items) {
      const vid = item.snippet.resourceId.videoId;
      const title = item.snippet.title;
      const a = document.createElement("a");
      a.className = "card";
      a.href = "https://youtu.be/" + vid;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = `
        <div class="thumb-wrap"><img src="https://i.ytimg.com/vi/${vid}/hqdefault.jpg" alt=""></div>
        <div class="card-body"><p class="card-title">${title}</p></div>
      `;
      grid.appendChild(a);
    }
  } catch (e) {
    grid.innerHTML = `<div class="loading">영상 목록을 불러오지 못했습니다.</div>`;
    console.error(e);
  }
}
loadVideos();

// 아이디어 제출: Cloudflare Worker로만 전송한다. 텔레그램 봇 토큰은 Worker의
// 암호화된 시크릿에만 있고, 이 페이지에는 어떤 자격증명도 들어있지 않다.
const IDEA_RELAY_URL = "https://bakonu-idea-relay.bakonu-relay.workers.dev";
const RATE_LIMIT_MS = 60000;

const ideaForm = document.getElementById("ideaForm");
const ideaText = document.getElementById("ideaText");
const ideaStatus = document.getElementById("ideaStatus");
const ideaBtn = document.getElementById("ideaSubmitBtn");

ideaForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const honeypot = ideaForm.website.value;
  const text = ideaText.value.trim();
  if (honeypot) return; // 봇으로 판단, 조용히 무시

  if (!text) {
    ideaStatus.textContent = "아이디어를 입력해주세요.";
    return;
  }
  const last = Number(localStorage.getItem("bakonu_idea_last") || 0);
  if (Date.now() - last < RATE_LIMIT_MS) {
    ideaStatus.textContent = "잠시 후 다시 시도해주세요.";
    return;
  }

  ideaBtn.disabled = true;
  ideaStatus.textContent = "보내는 중...";
  try {
    const res = await fetch(IDEA_RELAY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error("전송 실패 " + res.status);
    localStorage.setItem("bakonu_idea_last", String(Date.now()));
    ideaStatus.textContent = "전달됐습니다! 감사합니다 🙌";
    ideaText.value = "";
  } catch (err) {
    ideaStatus.textContent = "전송에 실패했습니다. 잠시 후 다시 시도해주세요.";
    console.error(err);
  } finally {
    ideaBtn.disabled = false;
  }
});
</script>
</body>
</html>
